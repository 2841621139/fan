name: Build WebDriverAgent IPA (unsigned)

# 与上一版唯一的区别：先切到 Xcode 16.x 再编译。
# 原因：用最新 Xcode（iOS 26 SDK）编出来的 runner，其 Testing.framework 依赖
# lib_TestingInterop.dylib，而 iOS 26.1 设备上能挂的 DDI 里没有这个库；
# 用 Xcode 16.x（iOS 18 SDK）编，就不需要它。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Show available Xcodes
        run: ls /Applications | grep -i '^Xcode' || true

      - name: Switch to Xcode 16.x if present
        run: |
          set -e
          for v in 16.4 16.3 16.2 16.1 16.0; do
            if [ -d "/Applications/Xcode_$v.app" ]; then
              echo "using Xcode_$v"
              sudo xcode-select -s "/Applications/Xcode_$v.app"
              break
            fi
          done
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Clone WebDriverAgent
        run: git clone --depth 1 https://github.com/appium/WebDriverAgent.git

      - name: Build for testing (no codesign)
        run: |
          set -e
          cd WebDriverAgent
          xcodebuild build-for-testing \
            -project WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package Payload into IPA (dSYM stripped)
        run: |
          set -e
          APP=$(find WebDriverAgent/build/Build/Products -maxdepth 2 -name 'WebDriverAgentRunner-Runner.app' | head -1)
          echo "runner app: $APP"
          test -n "$APP"
          plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|MinimumOSVersion' || true
          find "$APP" -name '*.dSYM' -type d -prune -exec rm -rf {} + || true
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../WebDriverAgent-unsigned.ipa Payload
          cd .. && ls -l WebDriverAgent-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebDriverAgent-unsigned-ipa
          path: WebDriverAgent-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
